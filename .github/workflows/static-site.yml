name: static-site

# Reusable workflow: provision + deploy a static site for the calling profile-* repo.
# Caller example:
#   jobs:
#     site:
#       uses: fhb4061/profile-manager-stacks/.github/workflows/static-site.yml@master
#       with:
#         build-cmd: npm run build
#         dist-dir: dist
#         aws-region: ${{ vars.AWS_REGION }}
#       secrets: inherit
# Required secrets in the caller (or org-level): AWS_DEPLOY_ROLE_ARN, AWS_ACTION_ROLE_ARN

on:
  workflow_call:
    inputs:
      build-cmd:
        description: "Command that builds the site (run from repo root)"
        required: true
        type: string
      dist-dir:
        description: "Directory the build writes static assets to"
        required: true
        type: string
      aws-region:
        description: "Region to deploy into"
        required: true
        type: string
      action:
        description: "deploy (default) or destroy"
        required: false
        type: string
        default: deploy

permissions:
  id-token: write
  contents: read

concurrency:
  group: static-site-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy:
    if: inputs.action == 'deploy'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site repo
        uses: actions/checkout@v4

      - name: Checkout infra (profile-manager-stacks)
        uses: actions/checkout@v4
        with:
          repository: fhb4061/profile-manager-stacks
          path: infra

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build site
        run: |
          npm ci
          ${{ inputs.build-cmd }}

      - name: Install infra deps
        run: npm ci
        working-directory: infra

      - name: Assume deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}

      - name: CDK deploy
        run: >
          npx cdk deploy --app "npx ts-node bin/static-site.ts"
          -c repository=${{ github.repository }}
          --require-approval never
          --outputs-file outputs.json
        working-directory: infra

      - name: Read stack outputs
        id: outputs
        run: |
          echo "bucket=$(jq -r 'to_entries[0].value.BucketName' outputs.json)" >> "$GITHUB_OUTPUT"
          echo "distribution=$(jq -r 'to_entries[0].value.DistributionId' outputs.json)" >> "$GITHUB_OUTPUT"
          echo "domain=$(jq -r 'to_entries[0].value.DistributionDomain' outputs.json)" >> "$GITHUB_OUTPUT"
        working-directory: infra

      - name: Assume action role (sync + invalidate)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ACTION_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}

      - name: Sync assets
        run: aws s3 sync "${{ inputs.dist-dir }}" "s3://${{ steps.outputs.outputs.bucket }}" --delete

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "${{ steps.outputs.outputs.distribution }}" --paths "/*"

      - name: Site URL
        run: echo "https://${{ steps.outputs.outputs.domain }}" >> "$GITHUB_STEP_SUMMARY"

  destroy:
    if: inputs.action == 'destroy'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout infra (profile-manager-stacks)
        uses: actions/checkout@v4
        with:
          repository: fhb4061/profile-manager-stacks
          path: infra

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install infra deps
        run: npm ci
        working-directory: infra

      - name: Assume deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}

      - name: CDK destroy
        run: >
          npx cdk destroy --app "npx ts-node bin/static-site.ts"
          -c repository=${{ github.repository }}
          --force
        working-directory: infra
